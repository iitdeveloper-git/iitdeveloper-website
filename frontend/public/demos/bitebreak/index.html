</style></head><body><div id="app"></div><div id="overlay"></div><div id="toast"></div>
<script>
const photo={bowl:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=700&auto=format&fit=crop&q=85',curry:'https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=700&auto=format&fit=crop&q=85',rice:'https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=700&auto=format&fit=crop&q=85',sandwich:'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=700&auto=format&fit=crop&q=85',coffee:'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=700&auto=format&fit=crop&q=85',salad:'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=700&auto=format&fit=crop&q=85'};
let foods=[],role='Customer',page='Menu',category='All items',query='',cart={},profile={name:'',email:'',employee:''},store={name:'',hours:'',open:false},orders=[],mine=[],counter=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+n;const total=()=>Object.entries(cart).reduce((a,[id,q])=>a+foods.find(f=>f.id==id).price*q,0);const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);const orderTotal=o=>o.items.reduce((a,i)=>a+i.price*i.qty,0);
function notify(t){document.getElementById('toast').innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;setTimeout(()=>document.getElementById('toast').innerHTML='',3000)}
function setRole(r){role=r;page=r==='Customer'?'Menu':r==='Worker'?'Orders':'Overview';query='';render()}
function go(p){page=p;query='';render();window.scrollTo(0,0)}
function shell(){let tabs=role==='Customer'?['Menu','My orders','Profile']:role==='Worker'?['Orders','Availability']:['Overview','Menu management','All orders','Store settings'];return `<div class="demo"><span><b>IITDEVELOPER</b> / INTERACTIVE PROTOTYPE</span><div class="role" aria-label="Preview role">${['Customer','Worker','Manager'].map(r=>`<button class="${r===role?'active':''}" onclick="setRole('${r}')">${r}</button>`).join('')}</div></div><header><div class="brand"><span class="logo">b.</span>bite<em>break</em></div><div class="location"><small>Your cafeteria</small><br><b>${esc(store.name)}</b> · Floor 2</div><nav>${tabs.map(t=>`<button class="${t===page?'active':''}" onclick="go('${t}')">${t}</button>`).join('')}<button aria-label="Open profile" onclick="role==='Customer'?go('Profile'):notify('Demo staff account')"><span class="avatar" style="display:grid;place-items:center">${role==='Customer'?'AS':role==='Worker'?'SK':'RM'}</span></button></nav></header>`}
function footer(){return `<footer><span>Good food. A better workday.</span><span>BiteBreak concept · Crafted by IITDeveloper</span></footer>`}
function render(){document.getElementById('app').innerHTML=shell()+(role==='Customer'?(page==='Menu'?menu():page==='My orders'?myOrders():profilePage()):role==='Worker'?(page==='Orders'?worker():management(true)):(page==='Overview'?overview():page==='Menu management'?management(false):page==='All orders'?allOrders():settings()));}
function cards(){let list=foods.filter(f=>(category==='All items'||f.cat===category)&&f.name.toLowerCase().includes(query.toLowerCase()));return list.length?list.map(f=>`<article class="food"><button class="image-button" aria-label="View ${esc(f.name)} details" onclick="detail(${f.id})"><img class="food-image" src="${f.img}" alt="${esc(f.name)}" loading="lazy">${f.badge?`<span class="badge">${f.badge}</span>`:''}</button><div class="food-body"><span class="veg">▣</span><h3>${esc(f.name)}</h3><p>${f.kcal} kcal · ${f.cat} · 10–15 min</p><div class="price-row"><span>${money(f.price)}</span><button class="add" ${!f.available?'disabled':''} onclick="add(${f.id})">${!f.available?'Sold out':cart[f.id]?'ADD + ('+cart[f.id]+')':'ADD +'}</button></div></div></article>`).join(''):`<p>No dishes found. Try another search or category.</p>`}
function menu(){return `<div class="layout"><main><div class="intro"><div><div class="eyebrow">A little break. A lot of good.</div><h1>What’s for lunch, ${esc(profile.name.split(' ')[0])}?</h1><p>Your favourites, freshly made. Pick up without the wait.</p></div><span class="pill">● ${store.open?'Kitchen open':'Ordering paused'}</span></div><section class="hero"><div class="hero-copy"><div class="eyebrow">Fresh from our kitchen</div><h2>Good food.<br>Great workdays.</h2><p>Wholesome bowls for your well-deserved lunch break.</p><button class="primary" onclick="setCategory('Meals')">Explore today’s menu ↗</button></div><img src="${photo.bowl}" alt="Colourful fresh lunch bowl"></section><input class="search" aria-label="Search menu" placeholder="⌕   Search for a dish you love…" value="${esc(query)}" oninput="query=this.value;document.getElementById('foodgrid').innerHTML=cards()"><div class="chips">${['All items','Meals','Snacks','Beverages','Healthy'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join('')}</div><div class="section-title"><h2>${category==='All items'?'Made for your midday':category}</h2><small>Freshly prepared, every day</small></div><div id="foodgrid" class="grid">${cards()}</div>${footer()}</main><aside class="aside" id="cart-area">${cartPanel()}<div class="little-card"><span class="circle">✓</span><div><strong>Made fresh. Served with care.</strong>Prepared in your office kitchen.<br>Pick up at Counter 01.</div></div></aside></div>${count()?`<button class="primary mobile-cart" onclick="document.getElementById('cart-area').scrollIntoView({behavior:'smooth'})">${count()} items · ${money(total())} · View cart ↑</button>`:''}`}
function setCategory(c){category=c;render()}
function add(id){if(!foods.find(f=>f.id===id).available)return;cart[id]=(cart[id]||0)+1;render();notify('Added to your cart')}
function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];render()}
function cartPanel(){return `<div class="cart"><div class="cart-top"><h2>Your lunch bag</h2><span class="pill">${count()} items</span></div><small style="font-size:11px">A good break starts here.</small><div class="pickup"><b>↗ &nbsp; Pickup at Counter 01</b><br><small>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${esc(store.name)} · Floor 2</small></div>${count()?Object.entries(cart).map(([id,q])=>{let f=foods.find(f=>f.id==id);return `<div class="cartline"><img src="${f.img}" alt=""><div><b>${esc(f.name)}</b><div class="qty"><button aria-label="Remove one ${esc(f.name)}" onclick="change(${id},-1)">−</button><span>${q}</span><button aria-label="Add one ${esc(f.name)}" onclick="change(${id},1)">+</button></div></div><span class="line-total">${money(f.price*q)}</span></div>`}).join(''):`<div class="empty">Your next favourite is on the menu.<br>Add something delicious to begin.</div>`}<div class="bill"><div><span>Item total</span><span>${money(total())}</span></div><div><span>Taxes</span><span>Included</span></div><div class="total"><span>To pay</span><span>${money(total())}</span></div></div><div class="pickup" style="background:white;margin:15px 0"><b>◉ &nbsp; Pay at the counter</b><br><small>No online payment in this demo</small></div><button class="primary full" ${!count()||!store.open?'disabled':''} onclick="placeOrder()">Place pickup order &nbsp; →</button><div class="cart-note">Freshly prepared in approximately 10–15 min</div></div>`}
function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><section role="dialog" aria-modal="true" aria-label="Details" class="modal"><button class="close" aria-label="Close dialog" onclick="closeModal()">×</button>${html}</section></div>`;document.querySelector('.modal .close').focus()}
function closeModal(){document.getElementById('overlay').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function detail(id){let f=foods.find(x=>x.id===id);modal(`<img src="${f.img}" alt="${esc(f.name)}"><div class="modal-content"><span class="pill">▣ Vegetarian · ${f.cat}</span><h2>${esc(f.name)}</h2><p>${esc(f.desc)}</p><div class="nutrition"><div><b>${f.kcal}</b><small>kcal</small></div><div><b>${f.protein}g</b><small>Protein</small></div><div><b>${f.carbs}g</b><small>Carbs</small></div><div><b>${f.fat}g</b><small>Fat</small></div></div><h4>What’s inside</h4><p>${esc(f.ingredients)}</p><p><b>Contains:</b> ${esc(f.allergens)}</p><small>Sample nutrition per serving · Illustrative food photography</small><button style="margin-top:22px" class="primary full" ${!f.available?'disabled':''} onclick="add(${id});closeModal()">${f.available?'Add to bag · '+money(f.price):'Currently sold out'}</button></div>`)}
function placeOrder(){if(!count()||!store.open)return;let unavailable=Object.keys(cart).some(id=>!foods.find(f=>f.id==id).available);if(unavailable){notify('An item is sold out. Please remove it from your bag.');return}let o={id:'BB-'+counter++,name:profile.name,items:Object.entries(cart).map(([id,qty])=>{let f=foods.find(x=>x.id==id);return {name:f.name,price:f.price,qty}}),status:'Placed',paid:false};orders.unshift(o);mine.unshift(o.id);cart={};go('My orders');notify('Order placed! Your pickup number is '+o.id)}
function myOrders(){let own=orders.filter(o=>mine.includes(o.id));return `<main class="wide" style="max-width:850px"><div class="intro"><div><div class="eyebrow">Your next good break</div><h1>My orders</h1><p>Follow your food from kitchen to counter.</p></div><button class="secondary" onclick="go('Menu')">Back to menu</button></div>${own.length?own.map(o=>`<article class="order-large"><div class="ticket-head"><div><small>PICKUP NUMBER</small><h1>${o.id}</h1></div><span class="pill">${o.status==='Ready'?'Ready for pickup':o.status}</span></div><div class="tracking">${['Placed','Preparing','Ready','Served'].map((s,i)=>`<div class="step ${['Placed','Preparing','Ready','Served'].indexOf(o.status)>=i?'done':''}"><span>${i+1}</span>${s}</div>`).join('')}</div>${o.items.map(i=>`<p>${i.qty} × ${esc(i.name)} <b style="float:right">${money(i.price*i.qty)}</b></p>`).join('')}<div class="pickup"><b>${o.status==='Ready'?'Your food is ready! Head to Counter 01.':'Pickup at Counter 01 · '+esc(store.name)}</b><br><small>${o.paid?'Payment received':'Pay '+money(orderTotal(o))+' at the counter'}</small></div><small>Prototype tip: switch to Worker to move this order forward.</small></article>`).join(''):`<div class="order-large empty"><h2>Your lunch story starts here</h2><p>Place your first order and we’ll keep you updated here.</p><button class="primary" onclick="go('Menu')">Explore the menu</button></div>`}${footer()}</main>`}
function profilePage(){return `<main class="wide"><div class="profile"><div class="eyebrow">Your account</div><h1 style="margin-top:12px">Hello, ${esc(profile.name.split(' ')[0])}.</h1><p style="color:var(--muted)">A few details to make your break easier.</p><form class="form" onsubmit="saveProfile(event)"><label>Full name<input name="name" value="${esc(profile.name)}" required></label><label>Work email<input type="email" name="email" value="${esc(profile.email)}" required></label><label>Employee ID<input name="employee" value="${esc(profile.employee)}"></label><button class="primary full">Save profile</button></form><button style="margin-top:20px" class="secondary full" onclick="auth(false)">Preview sign-in / sign-up</button><p class="screen-note">Demo account only. No authentication or personal data is sent to a server.</p></div></main>`}
function saveProfile(e){e.preventDefault();let d=new FormData(e.target);profile={name:d.get('name'),email:d.get('email'),employee:d.get('employee')};render();notify('Profile updated for this demo')}
function auth(signup){modal(`<div class="modal-content"><div class="brand" style="margin-top:20px">bite<em>break</em></div><h2>${signup?'A better break starts here.':'Welcome back.'}</h2><p>${signup?'Create your cafeteria account.':'Sign in for something delicious.'}</p><form class="form" onsubmit="event.preventDefault();closeModal();notify('Demo ${signup?'account created':'sign-in successful'}')">${signup?'<label>Full name<input required placeholder="Your full name"></label>':''}<label>Work email<input required type="email" placeholder="you@company.com"></label><label>Password<input required type="password" minlength="8" placeholder="At least 8 characters"></label><button class="primary full">${signup?'Create demo account':'Sign in to demo'}</button></form><button class="secondary full" style="margin-top:12px" onclick="auth(${!signup})">${signup?'Already have an account? Sign in':'New here? Create an account'}</button><p class="screen-note">Screen preview only · Do not enter a real password.</p></div>`)}
function worker(){return `<main class="wide"><div class="intro"><div><div class="eyebrow">Kitchen workspace / Counter 01</div><h1>A smooth service starts here.</h1><p>Track incoming orders and keep the good food moving.</p></div><span class="pill">● Live demo queue</span></div><input class="search" aria-label="Search orders" placeholder="⌕   Find an order by pickup number or customer…" oninput="query=this.value;document.getElementById('board').innerHTML=board()"><div id="board" class="board">${board()}</div>${footer()}</main>`}
function board(){return ['Placed','Preparing','Ready'].map(s=>{let os=orders.filter(o=>o.status===s&&(o.id+' '+o.name).toLowerCase().includes(query.toLowerCase()));return `<section class="column"><h3>${s==='Placed'?'New orders':s==='Ready'?'Ready for pickup':s} <span class="pill" style="float:right">${os.length}</span></h3>${os.map(o=>`<article class="ticket"><div class="ticket-head"><h3>#${o.id.split('-')[1]}</h3><span class="pill ${o.paid?'':'orange'}">${o.paid?'Paid':'Pay at counter'}</span></div><p style="color:var(--muted)">${esc(o.name)} · Counter 01</p><hr style="border:0;border-top:1px dashed var(--line)">${o.items.map(i=>`<p><b>${i.qty} ×</b> ${esc(i.name)}</p>`).join('')}<div class="ticket-head"><small>${o.items.reduce((a,i)=>a+i.qty,0)} items</small><b>${money(orderTotal(o))}</b></div>${!o.paid?`<button class="secondary full" style="margin-top:13px" onclick="paid('${o.id}')">Mark payment received</button>`:''}<button class="primary full" onclick="advance('${o.id}')">${s==='Placed'?'Start preparing':s==='Preparing'?'Mark ready for pickup':'Mark as served'} →</button></article>`).join('')||'<p class="empty">All clear. No orders here.</p>'}</section>`}).join('')}
function paid(id){orders.find(o=>o.id===id).paid=true;render();notify('Payment marked as received')}
function advance(id){let o=orders.find(o=>o.id===id);o.status={Placed:'Preparing',Preparing:'Ready',Ready:'Served'}[o.status]||o.status;render();notify(id+' · '+o.status)}
function overview(){let paidOrders=orders.filter(o=>o.paid);return `<main class="wide"><div class="intro"><div><div class="eyebrow">Manager workspace</div><h1>Your kitchen, at a glance.</h1><p>A little clarity for a better service.</p></div><span class="pill">Today · Demo data</span></div><div class="stats">${[['Paid sales',money(paidOrders.reduce((a,o)=>a+orderTotal(o),0)),'Payments marked received'],['Total orders',orders.length,'Across all order statuses'],['In the kitchen',orders.filter(o=>['Placed','Preparing'].includes(o.status)).length,'New and preparing'],['Available dishes',foods.filter(f=>f.available).length+' / '+foods.length,'On today’s menu']].map(s=>`<div class="stat"><small>${s[0]}</small><h2>${s[1]}</h2><p>${s[2]}</p></div>`).join('')}</div><div class="section-title"><h2>Latest orders</h2><button class="secondary" onclick="go('All orders')">View all orders →</button></div>${orderTable()}<div class="pickup" style="margin-top:24px"><b>Kitchen status: ${store.open?'accepting orders':'paused'}</b><br><small>${esc(store.hours)} · Counter 01 · ${esc(store.name)}</small></div>${footer()}</main>`}
function orderTable(){return `<div class="table-wrap"><table><thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${o.id}</b></td><td>${esc(o.name)}</td><td>${o.items.map(i=>i.qty+' × '+esc(i.name)).join('<br>')}</td><td>${money(orderTotal(o))}</td><td>${o.paid?'Paid':'Unpaid'}</td><td><span class="pill">${o.status}</span></td></tr>`).join('')}</tbody></table></div>`}
function allOrders(){return `<main class="wide"><div class="intro"><div><div class="eyebrow">Manager workspace</div><h1>Every order, in one place.</h1><p>Sample orders and your orders from this session.</p></div><button class="primary" onclick="exportCSV()">↓ Export CSV</button></div>${orderTable()}${footer()}</main>`}
function management(workerOnly){return `<main class="wide"><div class="intro"><div><div class="eyebrow">${workerOnly?'Kitchen':'Manager'} workspace</div><h1>${workerOnly?'Keep the menu up to date.':'Good food starts with a great menu.'}</h1><p>${workerOnly?'Mark sold-out dishes unavailable for customers.':'Manage dishes, pricing and availability.'}</p></div>${!workerOnly?'<button class="primary" onclick="editFood()">+ Add a dish</button>':''}</div><div class="table-wrap"><table><thead><tr><th>Dish</th><th>Category</th><th>Price</th><th>Calories</th><th>Availability</th>${!workerOnly?'<th>Action</th>':''}</tr></thead><tbody>${foods.map(f=>`<tr><td><img src="${f.img}" alt=""><b>${esc(f.name)}</b></td><td>${f.cat}</td><td>${money(f.price)}</td><td>${f.kcal} kcal</td><td><button class="toggle ${f.available?'':'off'}" onclick="toggleFood(${f.id})">${f.available?'● Available':'○ Sold out'}</button></td>${!workerOnly?`<td><button class="secondary" onclick="editFood(${f.id})">Edit</button></td>`:''}</tr>`).join('')}</tbody></table></div>${footer()}</main>`}
function toggleFood(id){let f=foods.find(f=>f.id===id);f.available=!f.available;render();notify(f.name+' is '+(f.available?'available':'sold out'))}
function editFood(id){let f=foods.find(f=>f.id===id)||{name:'',price:99,kcal:300,cat:'Meals',desc:'',ingredients:'',allergens:''};modal(`<div class="modal-content"><div class="eyebrow">Menu management</div><h2>${id?'Edit dish':'Something new on the menu.'}</h2><form class="form" onsubmit="saveFood(event,${id||0})"><label>Dish name<input name="name" value="${esc(f.name)}" required></label><label>Category<select name="cat">${['Meals','Snacks','Beverages','Healthy'].map(c=>`<option ${c===f.cat?'selected':''}>${c}</option>`).join('')}</select></label><label>Price (₹)<input name="price" type="number" min="1" max="10000" value="${f.price}" required></label><label>Calories per serving<input name="kcal" type="number" min="0" max="5000" value="${f.kcal}" required></label><label>Description<input name="desc" value="${esc(f.desc)}" required></label><label>Ingredients<input name="ingredients" value="${esc(f.ingredients)}" required></label><label>Allergens<input name="allergens" value="${esc(f.allergens)}" required></label><button class="primary full">Save dish</button><p class="screen-note">New dishes use a sample image and sample macros in this prototype.</p></form></div>`)}
function saveFood(e,id){e.preventDefault();let d=new FormData(e.target),data=Object.fromEntries(d.entries());data.price=Number(data.price);data.kcal=Number(data.kcal);if(id)Object.assign(foods.find(f=>f.id===id),data);else foods.push({...data,id:Math.max(...foods.map(f=>f.id))+1,protein:10,carbs:30,fat:10,img:photo.bowl,available:true,badge:'New'});closeModal();render();notify('Menu updated')}
function settings(){return `<main class="wide"><div class="profile"><div class="eyebrow">Manager workspace</div><h1 style="margin-top:12px">Your store details</h1><form class="form" onsubmit="saveStore(event)"><label>Store name<input name="name" value="${esc(store.name)}" required></label><label>Display hours<input name="hours" value="${esc(store.hours)}" required></label><label>Ordering status<select name="open"><option value="true" ${store.open?'selected':''}>Open — accepting orders</option><option value="false" ${!store.open?'selected':''}>Paused — no new orders</option></select></label><button class="primary full">Save settings</button></form><p class="screen-note">This prototype uses one cafeteria and one pickup counter. Hours are display-only; the status controls ordering.</p></div></main>`}
function saveStore(e){e.preventDefault();let d=new FormData(e.target);store={name:d.get('name'),hours:d.get('hours'),open:d.get('open')==='true'};render();notify('Store settings saved')}
function exportCSV(){let rows=[['Order ID','Customer','Total','Payment','Status'],...orders.map(o=>[o.id,o.name,orderTotal(o),o.paid?'Paid':'Unpaid',o.status])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='bitebreak-demo-orders.csv';a.click();URL.revokeObjectURL(a.href);notify('Demo orders exported')}
</script><link rel="stylesheet" href="app-screens.css"><script src="app-screens.js"></script><link rel="stylesheet" href="auth.css"><script src="api-client.js"></script></body></html>
