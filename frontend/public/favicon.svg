<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00539C"/>
      <stop offset="100%" stop-color="#0073CC"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded background for visibility in any browser tab -->
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Bold "IIT" letters in white -->
  <!-- I (left) -->
  <rect x="14" y="28" width="10" height="44" rx="2" fill="white"/>
  <!-- I (middle) -->
  <rect x="32" y="28" width="10" height="44" rx="2" fill="white"/>
  <!-- T (right) -->
  <rect x="46" y="28" width="40" height="10" rx="2" fill="#FFD662"/>
  <rect x="60" y="36" width="12" height="36" rx="2" fill="#FFD662"/>
</svg>
